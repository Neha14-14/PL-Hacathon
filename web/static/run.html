<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Run Jobs — Resilient Credit+ Guardian</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--border:#e2e5ec;--primary:#2563eb;--danger:#dc2626;--success:#16a34a;--warn:#ea580c;--muted:#64748b;--text:#1e293b;--radius:10px;--shadow:0 1px 3px rgba(0,0,0,.06)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;font-size:14px}

nav{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
nav .logo{font-weight:700;font-size:16px;letter-spacing:-.3px}
nav .logo span{color:var(--primary)}
nav .links{display:flex;gap:20px}
nav .links a{text-decoration:none;color:var(--muted);font-weight:500;font-size:13px;transition:.2s}
nav .links a:hover,nav .links a.active{color:var(--primary)}

.container{max-width:800px;margin:0 auto;padding:24px}

.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;background:#fff;color:var(--text);transition:.15s}
.btn:hover{background:var(--bg)}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:#1d4ed8}
.btn-danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn-danger:hover{background:#b91c1c}
.btn:disabled{opacity:.5;cursor:not-allowed}

select{padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fff;min-width:260px}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h2{font-size:16px;font-weight:600;margin-bottom:14px}

.form-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}

.status-code{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.sc-0{background:#f1f5f9;color:#475569}
.sc-1{background:#dbeafe;color:#1d4ed8}
.sc-2{background:#dcfce7;color:#15803d}
.sc-3{background:#fef2f2;color:#dc2626}

.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13px}
.kv .k{color:var(--muted);font-weight:500}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:100}
.popup{background:#fff;border-radius:12px;padding:24px;min-width:360px;max-width:420px;box-shadow:0 8px 32px rgba(0,0,0,.15);text-align:center}
.popup h3{font-size:16px;margin-bottom:14px}
.popup .kv{text-align:left;margin-bottom:16px}

.hidden{display:none}
</style>
</head>
<body>
<nav>
  <div class="logo">Resilient <span>Credit+</span> Guardian</div>
  <div class="links">
    <a href="/">Dashboard</a>
    <a href="/run" class="active">Run Jobs</a>
  </div>
</nav>

<div class="container">
  <div class="card">
    <h2>Run a Job</h2>
    <div class="form-row">
      <select id="jobSelect"><option value="">Loading...</option></select>
      <button class="btn btn-primary" id="runBtn" onclick="runJob()">Run</button>
      <button class="btn" onclick="refreshStatus()">Refresh</button>
    </div>
  </div>

  <div class="card" id="lastRunCard" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h2 style="margin:0">Last Run</h2>
      <button class="btn btn-danger" id="failBtn" onclick="failCurrent()" style="display:none">Cancel / Fail</button>
    </div>
    <div class="kv" id="lastRunInfo"></div>
  </div>
</div>

<!-- Popup -->
<div class="overlay hidden" id="popup">
  <div class="popup">
    <h3 id="popTitle">Job Submitted</h3>
    <div class="kv" id="popInfo"></div>
    <button class="btn btn-primary" onclick="closePopup()">OK</button>
  </div>
</div>

<script>
let lastRun=null;
let pollTimer=null;

function statusCode(s){
  if(s==='RUNNING')return {code:1,label:'1 — Picked (Running)',cls:'sc-1'};
  if(s==='COMPLETED')return {code:2,label:'2 — Success',cls:'sc-2'};
  if(s==='FAILED')return {code:3,label:'3 — Failed',cls:'sc-3'};
  return {code:0,label:'0 — Not Picked',cls:'sc-0'};
}

function fmt(ts){
  if(!ts)return '—';
  const d=new Date(ts);
  return d.toLocaleTimeString('en-IN',{hour12:false})+'.'+String(d.getMilliseconds()).padStart(3,'0');
}

async function loadOptions(){
  try{
    const d=await fetch('/api/job-options').then(r=>r.json());
    const sel=document.getElementById('jobSelect');
    sel.innerHTML='<option value="">— Select a job —</option>';
    const bg=document.createElement('optgroup');bg.label='Batches';
    (d.batches||[]).forEach(b=>{const o=document.createElement('option');o.value='batch:'+b.id;o.textContent=b.label+(b.avg_secs!=null?' (avg '+b.avg_secs+'s)':'');bg.appendChild(o);});
    sel.appendChild(bg);
    const rg=document.createElement('optgroup');rg.label='Reports';
    (d.reports||[]).forEach(r=>{const o=document.createElement('option');o.value='report:'+r.id;o.textContent=r.label+(r.avg_secs!=null?' (avg '+r.avg_secs+'s)':'');rg.appendChild(o);});
    sel.appendChild(rg);
  }catch(e){console.error(e)}
}

async function runJob(){
  const v=document.getElementById('jobSelect').value;
  if(!v)return;
  const [type,name]=v.split(':');
  const url=type==='batch'?'/api/run-batch':'/api/run-report';
  try{
    const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})}).then(r=>r.json());
    const jobId=res.job_id||res.batch_id||res.report_id;
    lastRun={type,name,jobId};

    const sc=statusCode('RUNNING');
    document.getElementById('popTitle').textContent='Job Submitted';
    document.getElementById('popInfo').innerHTML=`
      <span class="k">Type</span><span>${type}</span>
      <span class="k">Name</span><span>${name}</span>
      <span class="k">Job ID</span><span><strong>${jobId}</strong></span>
      <span class="k">Status</span><span><span class="status-code ${sc.cls}">${sc.label}</span></span>
    `;
    document.getElementById('popup').classList.remove('hidden');
    startPolling();
  }catch(e){alert('Error: '+e.message)}
}

function closePopup(){document.getElementById('popup').classList.add('hidden')}

function startPolling(){
  if(pollTimer)clearInterval(pollTimer);
  pollTimer=setInterval(refreshStatus,3000);
  refreshStatus();
}

async function refreshStatus(){
  if(!lastRun)return;
  try{
    const d=await fetch(`/api/job-status?type=${lastRun.type}&id=${lastRun.jobId}`).then(r=>r.json());
    const sc=statusCode(d.status);
    const card=document.getElementById('lastRunCard');
    card.style.display='';
    document.getElementById('lastRunInfo').innerHTML=`
      <span class="k">Job ID</span><span><strong>${d.id}</strong></span>
      <span class="k">Name</span><span>${d.batch_name||d.report_name}</span>
      <span class="k">Type</span><span>${lastRun.type}</span>
      <span class="k">Status</span><span><span class="status-code ${sc.cls}">${sc.label}</span></span>
      <span class="k">Start Time</span><span>${fmt(d.start_ts)}</span>
      <span class="k">End Time</span><span>${fmt(d.end_ts)}</span>
      <span class="k">Avg (secs)</span><span>${d.avg_secs||'—'}</span>
      <span class="k">Expected (secs)</span><span>${d.expected_secs||'—'}</span>
      ${d.error_message?`<span class="k">Error</span><span style="color:var(--danger)">${d.error_message}</span>`:''}
    `;
    document.getElementById('failBtn').style.display=d.status==='RUNNING'?'':'none';
    if(d.status!=='RUNNING'&&pollTimer){clearInterval(pollTimer);pollTimer=null;}
  }catch(e){console.error(e)}
}

async function failCurrent(){
  if(!lastRun)return;
  if(!confirm(`Cancel ${lastRun.type} job #${lastRun.jobId}?`))return;
  await fetch('/api/fail-job',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:lastRun.type,id:lastRun.jobId})});
  refreshStatus();
}

loadOptions();
</script>
</body>
</html>
